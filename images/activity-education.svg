<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#054520"/>
      <stop offset="100%" stop-color="#0E6E36"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#eduGrad)"/>
  <circle cx="300" cy="180" r="140" fill="#10B981" opacity="0.12"/>
  <circle cx="300" cy="180" r="85" fill="#FBBF24" opacity="0.12"/>

  <!-- Knowledge & Education Graphics -->
  <g transform="translate(195, 75)">
    <!-- Graduation Cap / Scholar Motif -->
    <path d="M105,40 L195,75 L105,110 L15,75 Z" fill="#032510" stroke="url(#gold)" stroke-width="4"/>
    <path d="M55,93 V135 C55,160 155,160 155,135 V93" fill="#0B5D2A" stroke="url(#gold)" stroke-width="3"/>
    <!-- Tassel -->
    <path d="M195,75 L205,110 L200,140" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="200" cy="142" r="5" fill="#FDE047"/>

    <!-- Open Book of Knowledge below Cap -->
    <g transform="translate(0, 95)">
      <!-- Pages left -->
      <path d="M105,65 C70,50 30,52 10,65 L10,125 C30,112 70,110 105,125 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
      <!-- Pages right -->
      <path d="M105,65 C140,50 180,52 200,65 L200,125 C180,112 140,110 105,125 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
      <!-- Book spine & bookmark -->
      <line x1="105" y1="65" x2="105" y2="135" stroke="url(#gold)" stroke-width="4"/>
      <!-- Page text lines -->
      <line x1="28" y1="80" x2="88" y2="76" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="28" y1="92" x2="88" y2="88" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="28" y1="104" x2="75" y2="101" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="122" y1="76" x2="182" y2="80" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="122" y1="88" x2="182" y2="92" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="122" y1="101" x2="170" y2="104" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Rising Sun of Enlightenment -->
    <path d="M105,30 L105,10 M75,34 L62,18 M135,34 L148,18" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title Ribbon -->
  <rect x="110" y="325" width="380" height="42" rx="21" fill="#032510" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="300" y="351" fill="#FDE68A" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">EDUCATION • CAPACITY • YOUTH EMPOWERMENT</text>
</svg>
