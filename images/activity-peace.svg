<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="peaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#054520"/>
      <stop offset="100%" stop-color="#08612E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#peaceGrad)"/>
  <circle cx="300" cy="190" r="140" fill="#34D399" opacity="0.12"/>
  <circle cx="300" cy="190" r="85" fill="#FBBF24" opacity="0.12"/>

  <!-- Dove of Peace with Olive Branch -->
  <g transform="translate(190, 80) scale(1.1)">
    <!-- Wings & Body of Dove -->
    <path d="M100,150 C70,120 40,60 110,40 C130,70 140,90 170,100 C190,90 210,85 220,95 C220,105 200,120 180,125 C160,140 140,165 100,150 Z" fill="#FFFFFF"/>
    <!-- Second wing layered -->
    <path d="M70,80 C60,40 100,20 130,35 C115,55 105,75 100,100 Z" fill="#F1F5F9"/>
    <!-- Head & Beak -->
    <circle cx="215" cy="95" r="14" fill="#FFFFFF"/>
    <path d="M228,94 L244,97 L228,103 Z" fill="url(#gold)"/>
    <!-- Olive sprig in beak -->
    <path d="M236,97 Q255,85 270,90" stroke="#10B981" stroke-width="3" fill="none"/>
    <ellipse cx="250" cy="85" rx="7" ry="4" transform="rotate(-30 250 85)" fill="#34D399"/>
    <ellipse cx="265" cy="88" rx="7" ry="4" transform="rotate(20 265 88)" fill="#34D399"/>
    <!-- Dove eye -->
    <circle cx="218" cy="93" r="2.5" fill="#0F172A"/>

    <!-- Peace hands clasped beneath -->
    <g transform="translate(45, 120) scale(0.65)">
      <path d="M40,55 L85,45 Q105,45 110,60 L100,80 Q85,90 60,85 L40,80 Z" fill="url(#gold)"/>
      <path d="M180,55 L135,45 Q115,45 110,60 L120,80 Q135,90 160,85 L180,80 Z" fill="#FDE68A"/>
    </g>
  </g>

  <!-- Title Ribbon -->
  <rect x="110" y="325" width="380" height="42" rx="21" fill="#032510" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="300" y="351" fill="#FDE68A" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">PEACE • CONFLICT PREVENTION • HARMONY</text>
</svg>
