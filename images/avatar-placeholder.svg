<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#053B1B"/>
      <stop offset="100%" stop-color="#0E5E2D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="300" height="340" rx="16" fill="url(#cardBg)"/>
  
  <!-- Subtle decorative ring -->
  <circle cx="150" cy="140" r="85" stroke="#10B981" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.4"/>
  <circle cx="150" cy="140" r="70" fill="#032510" stroke="url(#gold)" stroke-width="3"/>

  <!-- Professional Executive Silhouette -->
  <!-- Head -->
  <circle cx="150" cy="118" r="28" fill="#F8FAFC"/>
  <!-- Shoulders & Suit collar -->
  <path d="M102,185 C102,152 120,148 150,148 C180,148 198,152 198,185 Z" fill="#F8FAFC"/>
  <!-- Tie / Collar accent in gold & green -->
  <polygon points="144,148 156,148 153,172 150,178 147,172" fill="url(#gold)"/>
  <polygon points="147,148 153,148 150,154" fill="#054520"/>

  <!-- Emblem laurel accent at base of avatar circle -->
  <path d="M120,195 Q150,210 180,195" stroke="url(#gold)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Badge banner -->
  <rect x="35" y="255" width="230" height="42" rx="21" fill="#032510" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="150" y="276" fill="#FDE68A" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">OFFICIAL PORTRAIT</text>
  <text x="150" y="290" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">SYIAD Executive Council</text>
</svg>
