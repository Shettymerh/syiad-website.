<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04381A"/>
      <stop offset="100%" stop-color="#095D2A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#cultGrad)"/>
  
  <!-- African traditional geometric border pattern at top & bottom -->
  <g fill="url(#gold)" opacity="0.4">
    <polygon points="50,20 70,40 30,40"/>
    <polygon points="100,20 120,40 80,40"/>
    <polygon points="150,20 170,40 130,40"/>
    <polygon points="200,20 220,40 180,40"/>
    <polygon points="250,20 270,40 230,40"/>
    <polygon points="300,20 320,40 280,40"/>
    <polygon points="350,20 370,40 330,40"/>
    <polygon points="400,20 420,40 380,40"/>
    <polygon points="450,20 470,40 430,40"/>
    <polygon points="500,20 520,40 480,40"/>
    <polygon points="550,20 570,40 530,40"/>
  </g>

  <!-- Traditional African Talking Drum (Djembe / Kalangu) & Mask / Heritage Motif -->
  <g transform="translate(230, 70)">
    <!-- African Drum -->
    <!-- Drum head -->
    <ellipse cx="70" cy="50" rx="55" ry="18" fill="#FDE68A" stroke="url(#gold)" stroke-width="4"/>
    <ellipse cx="70" cy="50" rx="42" ry="12" fill="#F59E0B"/>
    <!-- Drum body -->
    <path d="M15,50 C25,100 45,130 50,150 L50,195 C35,215 35,225 30,230 L110,230 C105,225 105,215 90,195 L90,150 C95,130 115,100 125,50 Z" fill="#042611" stroke="url(#gold)" stroke-width="4"/>
    <!-- Drum ropes zigzag -->
    <path d="M25,55 L45,145 L40,56 L60,147 L60,57 L75,148 L80,56 L95,146 L100,55 L110,145 L115,55" stroke="#FDE047" stroke-width="2.5" fill="none"/>
    <!-- Base decoration -->
    <rect x="40" y="215" width="60" height="8" rx="4" fill="url(#gold)"/>

    <!-- Rhythm & Music waves -->
    <path d="M-30,45 Q-15,30 0,45" stroke="#34D399" stroke-width="3" fill="none"/>
    <path d="M-40,25 Q-20,10 0,25" stroke="#34D399" stroke-width="2.5" fill="none"/>
    <path d="M140,45 Q155,30 170,45" stroke="#34D399" stroke-width="3" fill="none"/>
    <path d="M140,25 Q160,10 180,25" stroke="#34D399" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Title Ribbon -->
  <rect x="110" y="325" width="380" height="42" rx="21" fill="#032510" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="300" y="351" fill="#FDE68A" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">CULTURE • AFRICAN HERITAGE • IDENTITY</text>
</svg>
