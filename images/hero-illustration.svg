<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#043B1B"/>
      <stop offset="60%" stop-color="#0B5D2A"/>
      <stop offset="100%" stop-color="#0E7737"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#E5A108"/>
      <stop offset="100%" stop-color="#B47B00"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="600" rx="24" fill="url(#skyGrad)"/>

  <!-- Subtle Geometric Pattern Overlay -->
  <g opacity="0.08" stroke="#FFF" stroke-width="1.5">
    <path d="M0,100 L800,100 M0,200 L800,200 M0,300 L800,300 M0,400 L800,400 M0,500 L800,500"/>
    <path d="M100,0 L100,600 M200,0 L200,600 M300,0 L300,600 M400,0 L400,600 M500,0 L500,600 M600,0 L600,600 M700,0 L700,600"/>
    <!-- Diagonal African motif lines -->
    <path d="M0,0 L600,600 M200,0 L800,600 M0,200 L400,600 M-200,0 L400,600" stroke-dasharray="8 8"/>
  </g>

  <!-- Radiant Sun Behind Continent (Hope & Dawn of African Youth) -->
  <circle cx="400" cy="270" r="190" fill="url(#sunGlow)"/>
  <circle cx="400" cy="270" r="140" fill="#FBBF24" opacity="0.25"/>
  <circle cx="400" cy="270" r="90" fill="#F59E0B" opacity="0.4"/>

  <!-- Stylized African Continent Silhouette -->
  <g filter="url(#shadow)" transform="translate(230, 90) scale(0.7)">
    <!-- African continent outline path -->
    <path d="M220,40 C280,35 340,55 380,100 C430,160 480,200 480,250 C480,310 440,360 410,410 C370,480 320,530 270,580 C240,610 220,620 205,620 C190,620 180,590 170,550 C150,470 120,410 90,360 C60,310 40,260 50,210 C60,160 110,130 150,110 C180,95 200,60 220,40 Z" fill="#042611" stroke="url(#goldGrad)" stroke-width="6"/>
    <!-- Madagascar -->
    <path d="M470,440 C485,460 490,490 480,520 C470,540 455,530 450,500 C445,470 455,445 470,440 Z" fill="url(#goldGrad)"/>
    <!-- Inner Radiant Lines within Africa -->
    <path d="M180,180 Q250,220 300,320 T240,520" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
  </g>

  <!-- Laurel Leaves of Integrity & Peace (Echoing official SYIAD crest) -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <!-- Left Wreath -->
    <path d="M140,240 Q110,210 135,190 Q160,220 140,240 Z"/>
    <path d="M120,290 Q85,270 105,245 Q135,270 120,290 Z"/>
    <path d="M115,350 Q80,340 95,310 Q125,330 115,350 Z"/>
    <path d="M125,410 Q95,415 105,380 Q135,395 125,410 Z"/>
    <path d="M150,470 Q125,485 130,450 Q160,455 150,470 Z"/>

    <!-- Right Wreath -->
    <path d="M660,240 Q690,210 665,190 Q640,220 660,240 Z"/>
    <path d="M680,290 Q715,270 695,245 Q665,270 680,290 Z"/>
    <path d="M685,350 Q720,340 705,310 Q675,330 685,350 Z"/>
    <path d="M675,410 Q705,415 695,380 Q665,395 675,410 Z"/>
    <path d="M650,470 Q675,485 670,450 Q640,455 650,470 Z"/>
  </g>

  <!-- Prominent Handshake of Unity & Peace (Foreground emblem) -->
  <g transform="translate(260, 430)" filter="url(#shadow)">
    <!-- Base Ribbon Card -->
    <rect x="0" y="0" width="280" height="95" rx="16" fill="#0A4620" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Stylized Hands in Union -->
    <path d="M35,48 Q70,48 95,42 L130,35 Q145,35 150,48 L142,65 Q130,75 105,72 L35,68 Z" fill="#F8FAFC"/>
    <path d="M245,48 Q210,48 185,42 L150,35 Q135,35 130,48 L138,65 Q150,75 175,72 L245,68 Z" fill="#E2E8F0"/>
    <path d="M115,40 L165,40 L155,62 L125,62 Z" fill="url(#goldGrad)"/>
    <!-- Interlocked fingers -->
    <path d="M125,48 C135,53 145,53 155,48" stroke="#043B1B" stroke-width="3" stroke-linecap="round"/>
    <path d="M128,55 C136,60 144,60 152,55" stroke="#043B1B" stroke-width="3" stroke-linecap="round"/>

    <!-- Small Integrity Banner text -->
    <text x="140" y="86" fill="#FDE68A" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">INTEGRITY • PEACE • UNITY</text>
  </g>

  <!-- Floating Feature Badges (Education, Leadership, Global) -->
  <!-- Badge 1: Education -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect width="170" height="52" rx="26" fill="#0B5D2A" stroke="#34D399" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="16" fill="#10B981"/>
    <!-- Graduation Cap / Book Icon -->
    <path d="M20,24 L28,19 L36,24 L28,29 Z" fill="#FFF"/>
    <path d="M24,27 V32 Q28,34 32,32 V27" stroke="#FFF" stroke-width="1.5" fill="none"/>
    <text x="56" y="24" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Education</text>
    <text x="56" y="38" fill="#A7F3D0" font-family="'Segoe UI', sans-serif" font-size="10">Empowering Minds</text>
  </g>

  <!-- Badge 2: Peacebuilding -->
  <g transform="translate(570, 110)" filter="url(#shadow)">
    <rect width="170" height="52" rx="26" fill="#0B5D2A" stroke="#FBBF24" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="16" fill="#F59E0B"/>
    <!-- Peace Dove / Leaf -->
    <path d="M22,29 Q28,20 34,22 Q31,27 25,28 Z" fill="#FFF"/>
    <text x="56" y="24" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Peacebuilding</text>
    <text x="56" y="38" fill="#FDE68A" font-family="'Segoe UI', sans-serif" font-size="10">Conflict Resolution</text>
  </g>

  <!-- Badge 3: African Youth -->
  <g transform="translate(580, 480)" filter="url(#shadow)">
    <rect width="165" height="52" rx="26" fill="#042F15" stroke="#34D399" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="16" fill="#059669"/>
    <!-- Stars / Spark -->
    <path d="M28,19 L30,24 L35,26 L30,28 L28,33 L26,28 L21,26 L26,24 Z" fill="#FDE68A"/>
    <text x="56" y="24" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Youth Integrity</text>
    <text x="56" y="38" fill="#A7F3D0" font-family="'Segoe UI', sans-serif" font-size="10">Ethical Leadership</text>
  </g>
</svg>
