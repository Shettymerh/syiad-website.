<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052E16"/>
      <stop offset="100%" stop-color="#0D4B25"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#projBg)"/>
  
  <!-- Dashed Border -->
  <rect x="20" y="20" width="560" height="340" rx="12" stroke="#10B981" stroke-width="2" stroke-dasharray="8 8" fill="none" opacity="0.4"/>

  <!-- Camera / Gallery Icon -->
  <g transform="translate(250, 110)">
    <rect x="0" y="25" width="100" height="75" rx="10" fill="#03210F" stroke="url(#gold)" stroke-width="3"/>
    <path d="M30,25 L40,12 L60,12 L70,25 Z" fill="url(#gold)"/>
    <circle cx="50" cy="62" r="22" stroke="#10B981" stroke-width="3" fill="#053B1B"/>
    <circle cx="50" cy="62" r="12" fill="url(#gold)"/>
    <circle cx="80" cy="38" r="4" fill="#FDE047"/>
  </g>

  <!-- Text -->
  <text x="300" y="240" fill="#F8FAFC" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="1" text-anchor="middle">PROGRAM PHOTOGRAPH PLACEHOLDER</text>
  <text x="300" y="268" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Field documentation &amp; program photographs to be published upon program rollout</text>
</svg>
